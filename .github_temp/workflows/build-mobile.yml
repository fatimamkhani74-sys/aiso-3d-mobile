name: Build Android APK and iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web
        run: |
          cd mobile
          npm install
          node build-mobile.js
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Aiso3DViewer-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: 🍎 Build iOS App (Xcode)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          cd mobile
          npm install
          node build-mobile.js
          npx cap sync ios

      - name: Build iOS Archive
        run: |
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -allowProvisioningUpdates -sdk iphoneos build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd mobile/ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r Aiso3DViewer.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aiso3DViewer-iOS-IPA
          path: mobile/ios/App/build/Build/Products/Release-iphoneos/Aiso3DViewer.ipa
